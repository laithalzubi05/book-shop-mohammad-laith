name: Prod — Promotion-Only Pipeline

on:
  push:
    branches: [prod]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1 — Read IMAGE_VERSION from repo variable (no build allowed)
        run: echo "Deploying version ${{ vars.IMAGE_VERSION }}"

      - name: 2 — Deploy to EC2 by pulling existing image from Docker Hub
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2_key.pem
          chmod 600 /tmp/ec2_key.pem

          ssh -i /tmp/ec2_key.pem \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              ubuntu@${{ vars.EC2_HOST }} bash -s << 'ENDSSH'
          set -e
          sudo chown -R ubuntu:ubuntu /app 2>/dev/null || true
          mkdir -p /app/prod
          cd /app/prod

          printf '%s\n' \
            "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" \
            "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" \
            "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" \
            "POSTGRES_HOST=db" \
            "SECRET_KEY=${{ secrets.SECRET_KEY }}" \
            "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/book-shop" \
            "IMAGE_TAG=${{ vars.IMAGE_VERSION }}" \
            "HOST_PORT=8000" \
            "ALLOWED_HOSTS=*" > .env

          cat > docker-compose.yml << 'EOF'
          services:
            db:
              image: postgres:15
              volumes:
                - pgdata_prod:/var/lib/postgresql/data
              env_file:
                - .env
            backend:
              image: ${IMAGE_NAME}:${IMAGE_TAG}
              ports:
                - "8000:8000"
              depends_on:
                - db
              env_file:
                - .env
          volumes:
            pgdata_prod:
          EOF

          docker-compose -p prod pull
          docker-compose -p prod down
          docker-compose -p prod up -d
          ENDSSH

          rm -f /tmp/ec2_key.pem