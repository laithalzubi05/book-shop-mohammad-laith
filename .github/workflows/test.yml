name: Test — Image-First Pipeline

on:
  push:
    branches: [test]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1 — Checkout source code (fresh, not from dev artifacts)
        uses: actions/checkout@v4

      - name: 2 — Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3 — Install Python dependencies
        run: |
          cd book-shop
          pip install -r requirements.txt

      - name: 4 — Build fresh artifact from source
        run: |
          ARTIFACT="app-${{ github.sha }}.tar.gz"
          tar -czf ${ARTIFACT} -C book-shop .
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: 5 — Copy artifact into Docker build context
        run: cp ${{ env.ARTIFACT }} book-shop/artifact.tar.gz

      - name: 6 — Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 7 — Build Docker image from fresh artifact and push to Docker Hub
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/book-shop:${{ github.sha }}"
          docker build -t ${IMAGE} book-shop/
          docker push ${IMAGE}

      - name: 8 — Deploy to EC2 by pulling from Docker Hub
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2_key.pem
          chmod 600 /tmp/ec2_key.pem

          ssh -i /tmp/ec2_key.pem \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              ubuntu@${{ vars.EC2_HOST }} bash -s << 'ENDSSH'
          set -e
          sudo chown -R ubuntu:ubuntu /app 2>/dev/null || true
          mkdir -p /app/test
          cd /app/test

          printf '%s\n' \
            "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" \
            "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" \
            "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" \
            "POSTGRES_HOST=db" \
            "SECRET_KEY=${{ secrets.SECRET_KEY }}" \
            "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/book-shop" \
            "IMAGE_TAG=${{ github.sha }}" \
            "HOST_PORT=8002" \
            "ALLOWED_HOSTS=*" > .env

          cat > docker-compose.yml << 'EOF'
          services:
            db:
              image: postgres:15
              volumes:
                - pgdata_test:/var/lib/postgresql/data
              env_file:
                - .env
            backend:
              image: ${IMAGE_NAME}:${IMAGE_TAG}
              ports:
                - "8002:8000"
              depends_on:
                - db
              env_file:
                - .env
          volumes:
            pgdata_test:
          EOF

          docker-compose -p test pull
          docker-compose -p test down
          docker-compose -p test up -d
          ENDSSH

          rm -f /tmp/ec2_key.pem