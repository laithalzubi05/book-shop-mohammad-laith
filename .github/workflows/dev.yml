name: Dev — Artifact-First Pipeline

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1 — Checkout source code
        uses: actions/checkout@v4

      - name: 2 — Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3 — Install Python dependencies
        run: |
          cd book-shop
          pip install -r requirements.txt

      - name: 4 — Package artifact
        run: |
          mkdir -p artifacts
          ARTIFACT="app-${{ github.sha }}.tar.gz"
          tar -czf artifacts/${ARTIFACT} -C book-shop .
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: 5 — Commit artifact to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin dev --rebase
          git add artifacts/
          git commit -m "ci: artifact for ${{ github.sha }}"
          git push

      - name: 6 — Copy artifact into Docker build context
        run: cp artifacts/${{ env.ARTIFACT }} book-shop/artifact.tar.gz

      - name: 7 — Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 8 — Build Docker image from artifact and push
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/book-shop:dev-${{ github.sha }}"
          docker build -t ${IMAGE} book-shop/
          docker push ${IMAGE}

      - name: 9 — Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /app/dev
            cd /app/dev

            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}"              > .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}"         >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "POSTGRES_HOST=db"                                    >> .env
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}"               >> .env
            echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/book-shop" >> .env
            echo "IMAGE_TAG=dev-${{ github.sha }}"                    >> .env
            echo "HOST_PORT=8001"                                      >> .env
            echo "ALLOWED_HOSTS=*"                                     >> .env

            cat > docker-compose.yml << 'EOF'
            services:
              db:
                image: postgres:15
                volumes:
                  - pgdata_dev:/var/lib/postgresql/data
                env_file:
                  - .env
              backend:
                image: ${IMAGE_NAME}:${IMAGE_TAG}
                ports:
                  - "8001:8000"
                depends_on:
                  - db
                env_file:
                  - .env
            volumes:
              pgdata_dev:
            EOF

            docker compose -p dev pull
            docker compose -p dev down
            docker compose -p dev up -d