name: dev pipeline

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd book-shop
          pip install -r requirements.txt

      - name: Pull latest dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin dev --rebase

      - name: Create artifact
        run: |
          mkdir -p artifacts
          ARTIFACT="app-${{ github.sha }}.tar.gz"
          tar -czf artifacts/${ARTIFACT} -C book-shop .
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: Commit artifact
        run: |
          git add artifacts/
          git diff --cached --quiet && echo "already committed" || (git commit -m "add artifact for ${{ github.sha }}" && git push)

      - name: Copy artifact to build folder
        run: cp artifacts/${{ env.ARTIFACT }} book-shop/artifact.tar.gz

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/book-shop:dev-${{ github.sha }}"
          docker build -t ${IMAGE} book-shop/
          docker push ${IMAGE}

      - name: Deploy to EC2
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2_key.pem
          chmod 600 /tmp/ec2_key.pem

          ssh -i /tmp/ec2_key.pem \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              ubuntu@${{ vars.EC2_HOST }} bash -s << 'ENDSSH'
          set -e
          sudo chown -R ubuntu:ubuntu /app 2>/dev/null || true
          mkdir -p /app/dev
          cd /app/dev

          printf '%s\n' \
            "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" \
            "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" \
            "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" \
            "POSTGRES_HOST=db" \
            "SECRET_KEY=${{ secrets.SECRET_KEY }}" \
            "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/book-shop" \
            "IMAGE_TAG=dev-${{ github.sha }}" \
            "HOST_PORT=8001" \
            "ALLOWED_HOSTS=*" > .env

          cat > docker-compose.yml << 'EOF'
          services:
            db:
              image: postgres:15
              volumes:
                - pgdata_dev:/var/lib/postgresql/data
              env_file:
                - .env
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
                interval: 5s
                timeout: 5s
                retries: 10
            backend:
              image: ${IMAGE_NAME}:${IMAGE_TAG}
              ports:
                - "8001:8000"
              depends_on:
                db:
                  condition: service_healthy
              env_file:
                - .env
          volumes:
            pgdata_dev:
          EOF

          docker-compose -p dev pull
          docker-compose -p dev down
          docker-compose -p dev up -d
          ENDSSH

          rm -f /tmp/ec2_key.pem
